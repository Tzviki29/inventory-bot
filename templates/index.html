<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Check</title>
<style>
  :root {
    --charcoal: #1c1e1f;
    --panel: #26292a;
    --amber: #f2a900;
    --off-white: #e9e6df;
    --dim: #9a9d9e;
    --danger: #c4453a;
    --ok: #5c8f5c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--charcoal);
    color: var(--off-white);
    font-family: "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }

  main {
    width: 100%;
    max-width: 420px;
  }

  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--dim);
    margin: 0 0 24px;
  }

  .field {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 0.85rem;
    color: var(--dim);
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 14px;
    font-size: 1.4rem;
    font-family: "Courier New", monospace;
    background: var(--panel);
    border: 1px solid #3a3d3e;
    border-radius: 4px;
    color: var(--off-white);
  }

  input:focus {
    outline: none;
    border-color: var(--amber);
  }

  button {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    background: var(--amber);
    color: #1c1e1f;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 4px;
  }

  button:disabled {
    background: #555;
    color: #999;
    cursor: not-allowed;
  }

  button.secondary {
    background: transparent;
    border: 1px solid var(--amber);
    color: var(--amber);
  }

  .result {
    background: var(--panel);
    border-radius: 4px;
    padding: 20px;
    margin-top: 24px;
    display: none;
  }

  .result.show { display: block; }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 0;
    border-bottom: 1px solid #3a3d3e;
  }

  .result-row:last-child { border-bottom: none; }

  .result-label {
    color: var(--dim);
    font-size: 0.85rem;
  }

  .result-value {
    font-family: "Courier New", monospace;
    font-size: 1.3rem;
  }

  .qty-low { color: var(--danger); }
  .out-of-stock {
    display: inline-block;
    margin-top: 4px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--danger);
  }

  .relocate-section {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #3a3d3e;
  }

  select {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    background: var(--panel);
    border: 1px solid #3a3d3e;
    border-radius: 4px;
    color: var(--off-white);
  }

  .action-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .action-tab {
    flex: 1;
    padding: 10px;
    font-size: 0.8rem;
    font-weight: 600;
    background: var(--charcoal);
    border: 1px solid #3a3d3e;
    border-radius: 4px;
    color: var(--dim);
    cursor: pointer;
    text-align: center;
  }

  .action-tab.active {
    border-color: var(--amber);
    color: var(--amber);
  }

  .relocate-fields { display: none; }
  .relocate-fields.active { display: block; }

  .take-section {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #3a3d3e;
  }

  .message {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 4px;
    font-size: 0.9rem;
    display: none;
  }

  .message.show { display: block; }
  .message.error { background: rgba(196,69,58,0.15); color: #e08a80; }
  .message.success { background: rgba(92,143,92,0.15); color: #9fc99f; }
</style>
</head>
<body>
<main>
  <h1>WAREHOUSE INVENTORY</h1>

  <div class="field">
    <label for="itemInput">Item number</label>
    <input type="text" id="itemInput" placeholder="e.g. 1234" autofocus>
  </div>
  <button id="lookupBtn">Check stock</button>

  <div id="result" class="result">
    <div class="result-row">
      <span class="result-label">Location(s)</span>
      <span class="result-value" id="resultLocation">—</span>
    </div>
    <div class="result-row">
      <span class="result-label">Quantity left</span>
      <span class="result-value" id="resultQty">—</span>
    </div>
    <div id="outOfStockBadge" class="out-of-stock" style="display:none;">OUT OF STOCK</div>

    <div class="take-section">
      <div class="field">
        <label for="takeInput">Taking how many?</label>
        <input type="number" id="takeInput" min="1" placeholder="e.g. 2">
      </div>
      <button id="takeBtn" class="secondary">Update inventory</button>

      <div class="field" style="margin-top: 16px;">
        <label for="addInput">Adding how many? (restocking)</label>
        <input type="number" id="addInput" min="1" placeholder="e.g. 10">
      </div>
      <button id="addBtn" class="secondary">Add to inventory</button>
    </div>

    <div class="relocate-section">
      <label>Relocate item</label>
      <div class="action-tabs">
        <div class="action-tab active" data-action="replace">Replace one</div>
        <div class="action-tab" data-action="add">Add new</div>
        <div class="action-tab" data-action="clear">Clear & set</div>
      </div>

      <div class="relocate-fields active" id="fields-replace">
        <div class="field">
          <label for="oldLocationSelect">Current location to replace</label>
          <select id="oldLocationSelect"></select>
        </div>
        <div class="field">
          <label for="replaceNewLocation">New location</label>
          <input type="text" id="replaceNewLocation" placeholder="e.g. 3CD">
        </div>
      </div>

      <div class="relocate-fields" id="fields-add">
        <div class="field">
          <label for="addNewLocation">Location to add</label>
          <input type="text" id="addNewLocation" placeholder="e.g. 3CD">
        </div>
      </div>

      <div class="relocate-fields" id="fields-clear">
        <div class="field">
          <label for="clearNewLocation">New single location (replaces all)</label>
          <input type="text" id="clearNewLocation" placeholder="e.g. 3CD">
        </div>
      </div>

      <button id="relocateBtn" class="secondary">Update location</button>
    </div>
  </div>

  <div id="message" class="message"></div>
</main>

<script>
  let currentItem = null;
  let currentLocations = [];

  const itemInput = document.getElementById('itemInput');
  const takeInput = document.getElementById('takeInput');
  const addInput = document.getElementById('addInput');
  const lookupBtn = document.getElementById('lookupBtn');
  const takeBtn = document.getElementById('takeBtn');
  const addBtn = document.getElementById('addBtn');
  const result = document.getElementById('result');
  const resultLocation = document.getElementById('resultLocation');
  const resultQty = document.getElementById('resultQty');
  const outOfStockBadge = document.getElementById('outOfStockBadge');
  const message = document.getElementById('message');
  const oldLocationSelect = document.getElementById('oldLocationSelect');
  const relocateBtn = document.getElementById('relocateBtn');
  const actionTabs = document.querySelectorAll('.action-tab');
  let currentAction = 'replace';

  function showMessage(text, type) {
    message.textContent = text;
    message.className = 'message show ' + type;
  }

  function clearMessage() {
    message.className = 'message';
  }

  function updateResultDisplay(location, qty) {
    resultLocation.textContent = location;
    resultQty.textContent = qty;
    const qtyNum = Number(qty);
    resultQty.className = 'result-value' + (qtyNum <= 5 ? ' qty-low' : '');
    outOfStockBadge.style.display = qtyNum <= 0 ? 'inline-block' : 'none';
    result.classList.add('show');

    currentLocations = location ? location.split(',').map(l => l.trim()).filter(Boolean) : [];
    oldLocationSelect.innerHTML = currentLocations
      .map(loc => `<option value="${loc}">${loc}</option>`)
      .join('');
  }

  actionTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      actionTabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentAction = tab.dataset.action;
      document.querySelectorAll('.relocate-fields').forEach(f => f.classList.remove('active'));
      document.getElementById('fields-' + currentAction).classList.add('active');
    });
  });

  async function lookupItem() {
    const item = itemInput.value.trim();
    if (!item) return;

    clearMessage();
    lookupBtn.disabled = true;
    lookupBtn.textContent = 'Checking...';

    try {
      const res = await fetch('/lookup?item=' + encodeURIComponent(item));
      const data = await res.json();

      if (!res.ok) {
        showMessage(data.error || 'Something went wrong', 'error');
        result.classList.remove('show');
      } else {
        currentItem = item;
        updateResultDisplay(data.location, data.quantity);
        takeInput.value = '';
      }
    } catch (err) {
      showMessage('Could not reach the server', 'error');
    } finally {
      lookupBtn.disabled = false;
      lookupBtn.textContent = 'Check stock';
    }
  }

  async function takeItems() {
    const takeAmount = takeInput.value.trim();
    if (!takeAmount || !currentItem) return;

    clearMessage();
    takeBtn.disabled = true;
    takeBtn.textContent = 'Updating...';

    try {
      const res = await fetch('/take', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item: currentItem, take: takeAmount })
      });
      const data = await res.json();

      if (!res.ok) {
        showMessage(data.error || 'Something went wrong', 'error');
      } else {
        updateResultDisplay(data.location, data.new_quantity);
        takeInput.value = '';
        showMessage(
          'Took ' + data.taken + '. ' + data.new_quantity + ' left of item ' + data.item + '.',
          'success'
        );
      }
    } catch (err) {
      showMessage('Could not reach the server', 'error');
    } finally {
      takeBtn.disabled = false;
      takeBtn.textContent = 'Update inventory';
    }
  }

  async function addStockItems() {
    const addAmount = addInput.value.trim();
    if (!addAmount || !currentItem) return;

    clearMessage();
    addBtn.disabled = true;
    addBtn.textContent = 'Updating...';

    try {
      const res = await fetch('/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item: currentItem, add: addAmount })
      });
      const data = await res.json();

      if (!res.ok) {
        showMessage(data.error || 'Something went wrong', 'error');
      } else {
        updateResultDisplay(data.location, data.new_quantity);
        addInput.value = '';
        showMessage(
          'Added ' + data.added + '. ' + data.new_quantity + ' now in stock for item ' + data.item + '.',
          'success'
        );
      }
    } catch (err) {
      showMessage('Could not reach the server', 'error');
    } finally {
      addBtn.disabled = false;
      addBtn.textContent = 'Add to inventory';
    }
  }

  async function relocateItem() {
    if (!currentItem) return;

    let payload = { item: currentItem, action: currentAction };

    if (currentAction === 'replace') {
      payload.old_location = oldLocationSelect.value;
      payload.new_location = document.getElementById('replaceNewLocation').value.trim();
      if (!payload.new_location) { showMessage('Enter a new location', 'error'); return; }
    } else if (currentAction === 'add') {
      payload.new_location = document.getElementById('addNewLocation').value.trim();
      if (!payload.new_location) { showMessage('Enter a location to add', 'error'); return; }
    } else if (currentAction === 'clear') {
      payload.new_location = document.getElementById('clearNewLocation').value.trim();
      if (!payload.new_location) { showMessage('Enter the new location', 'error'); return; }
    }

    clearMessage();
    relocateBtn.disabled = true;
    relocateBtn.textContent = 'Updating...';

    try {
      const res = await fetch('/relocate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (!res.ok) {
        showMessage(data.error || 'Something went wrong', 'error');
      } else {
        resultLocation.textContent = data.location;
        currentLocations = data.location ? data.location.split(',').map(l => l.trim()).filter(Boolean) : [];
        oldLocationSelect.innerHTML = currentLocations
          .map(loc => `<option value="${loc}">${loc}</option>`)
          .join('');
        document.getElementById('replaceNewLocation').value = '';
        document.getElementById('addNewLocation').value = '';
        document.getElementById('clearNewLocation').value = '';
        showMessage('Location updated to: ' + data.location, 'success');
      }
    } catch (err) {
      showMessage('Could not reach the server', 'error');
    } finally {
      relocateBtn.disabled = false;
      relocateBtn.textContent = 'Update location';
    }
  }

  lookupBtn.addEventListener('click', lookupItem);
  takeBtn.addEventListener('click', takeItems);
  addBtn.addEventListener('click', addStockItems);
  relocateBtn.addEventListener('click', relocateItem);
  itemInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') lookupItem(); });
  takeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') takeItems(); });
  addInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addStockItems(); });
</script>
</body>
</html>
